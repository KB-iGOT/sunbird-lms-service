# PostgreSQL Configuration Properties for Sunbird LMS Service
# System Settings Migration Configuration

# Database type selection: 'cassandra' or 'postgresql'
# Default is 'cassandra' for backward compatibility
sunbird_system_settings_db_type=postgresql

# PostgreSQL Connection Settings
sunbird_pg_host=localhost
sunbird_pg_port=5432
sunbird_pg_db=sunbird
sunbird_pg_user=postgres
sunbird_pg_password=password

# PostgreSQL Connection Pool Settings
sunbird_pg_pool_max_size=10
sunbird_pg_pool_min_idle=2
sunbird_pg_connection_timeout=30000
sunbird_pg_idle_timeout=600000
sunbird_pg_max_lifetime=1800000

# Migration Settings
sunbird_enable_migration_verification=true
sunbird_migration_sample_size=5