# Database configuration - PostgreSQL
db=postgres
db-url=jdbc:postgresql://localhost:5432/keycloak24_local
db-username=keycloak_user
db-password=keycloak_pass

# Basic HTTP configuration
http-enabled=true
http-port=8080
https-port=8443

# Hostname configuration (for local development)
hostname-strict=false
hostname-strict-https=false
hostname-debug=true

# Log level
log-level=INFO

# Enable features for realm import
features=js-adapter,admin-fine-grained-authz,scripts

# Development mode
start-dev=false
